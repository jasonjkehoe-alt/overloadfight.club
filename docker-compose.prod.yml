version: '3.8'

services:
  overloadfight-club:
    image: ghcr.io/jasonjkehoe-alt/overloadfight.club:latest
    container_name: overloadfight-club
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Direct bind-mount to host ./data directory for persistent SQLite databases and map storage
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - TZ=America/Chicago
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env next to this file}
      - SESSION_SECRET=${SESSION_SECRET:?set SESSION_SECRET in .env next to this file}
      # Optional (S18): the fight-night channel's webhook, and the origin its links use
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL:-}
      - SITE_URL=${SITE_URL:-}
    # Rotate the container log: at most 3 files of 10 MB (Synology defaults to its own "db" driver)
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # /api/health queries both databases; the start period covers the one-time game_players backfill
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
