name: CI

on:
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # better-sqlite3 11.8 does not compile on Node 24
      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # vite build, not npm run build: prebuild rewrites the tracked public/version.json
      - name: Build client
        run: npx vite build

      - name: Test
        run: npx vitest run
