services:
  overload-taunt-maker:
    # Option A: Build locally from source on your Synology box or PC
    build:
      context: .
      dockerfile: Dockerfile
    
    # Option B: Use the pre-built image published automatically by GitHub Actions
    # Replace <your-github-username> with your actual GitHub account or organization
    # image: ghcr.io/<your-github-username>/overload-taunt-maker:latest
    
    container_name: overload-taunt-maker
    restart: unless-stopped
    ports:
      # Change the left port (host port) if 5173 is already in use on your Synology NAS
      - "5173:5173"
    environment:
      - PORT=5173
      - HOST=0.0.0.0
      - OVERLOAD_PATH=/overload
      - TZ=UTC
    volumes:
      # Mount Overload storage folder on your Synology NAS:
      # Option 1 (relative): ./overload-data
      # Option 2 (DSM absolute): /volume1/docker/overload-taunt-maker/overload:/overload
      # Option 3 (Direct Synology Drive shared folder): /volume1/SynologyDrive/Overload:/overload
      - ./overload-data:/overload

  # ==============================================================================
  # OPTIONAL: Watchtower for 100% Automated Updates from GitHub
  # Uncomment the block below to automatically pull and restart whenever you push
  # new changes to GitHub without having to log into DSM!
  # ==============================================================================
  # watchtower:
  #   image: containrrr/watchtower:latest
  #   container_name: overload-watchtower
  #   restart: unless-stopped
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #   command: --interval 300 --cleanup overload-taunt-maker
