services:
  overloadfight-club:
    image: ghcr.io/jasonjkehoe-alt/overloadfight.club:latest
    build:
      context: .
      dockerfile: Dockerfile
    
    container_name: overloadfight-club
    restart: unless-stopped
    ports:
      # Change host port (left) if 5173 is already in use on your Synology NAS
      - "5173:5173"
    environment:
      - PORT=5173
      - HOST=0.0.0.0
      - OVERLOAD_PATH=/overload
      - TZ=UTC
    volumes:
      # Mount Overload storage folder on your Synology NAS:
      # Option 1 (relative): ./overload-data:/overload
      # Option 2 (DSM absolute): /volume1/docker/overloadfight.club/data:/overload
      # Option 3 (Direct Synology Drive share): /volume1/SynologyDrive/Overload:/overload
      - ./overload-data:/overload

  # ==============================================================================
  # OPTIONAL: Watchtower for 100% Automated Updates from GitHub
  # Uncomment the block below to automatically pull and restart whenever you push
  # new changes to GitHub without having to log into DSM!
