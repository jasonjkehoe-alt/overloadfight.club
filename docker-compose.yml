version: '3.8'

services:
  overloadfight-club:
    build: .
    image: overloadfight-club:latest
    container_name: overloadfight-club
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      # Direct bind-mount to host ./data directory for persistent SQLite databases and map storage
      - ./data:/app/data
    environment:
      - NODE_ENV=production
      - TZ=America/Chicago
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SESSION_SECRET=${SESSION_SECRET}
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
